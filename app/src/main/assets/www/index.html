<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cubillo Moya</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="wd-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060911;color:#fff;font-family:system-ui,sans-serif;transition:opacity .35s ease"><strong style="font-size:22px;letter-spacing:-0.02em">Cubillo Moya</strong></div><script>window.addEventListener('load',function(){setTimeout(function(){var s=document.getElementById('wd-splash');if(s){s.style.opacity='0';setTimeout(function(){s.remove()},350)}},320)});</script>
<div class="mesh-bg" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app-shell">
  <header class="topbar glass">
    <div class="brand">Cubillo Moya</div>
    <div class="profile-seg" role="group" aria-label="Usuario activo">
      <button type="button" class="seg-btn active" data-user="maria">María</button>
      <button type="button" class="seg-btn" data-user="obed">Obed</button>
    </div>
  </header>

  <main class="content">
    <section class="hero-card glass-hero">
      <div class="hero-top">
        <div>
          <p class="kicker" id="monthLabel">Gastos del Mes</p>
          <h1 id="totalExpense" class="hero-num">$0.00</h1>
        </div>
        <button type="button" id="openAddBtn" class="cta-btn">+ Gasto</button>
      </div>
      <div class="progress-track">
        <div id="budgetBar" class="progress-fill" style="width:0%"></div>
      </div>
      <div class="hero-foot">
        <span id="budgetInfo" class="muted">Presupuesto mensual</span>
        <span id="incomeInfo" class="pos">Ingresos: $0.00</span>
      </div>
    </section>

    <section class="glass card couple-card">
      <div class="couple-row">
        <div>
          <span class="kicker">María pagó</span>
          <strong id="mariaPaid" class="num amber">$0.00</strong>
        </div>
        <div>
          <span class="kicker">Obed pagó</span>
          <strong id="obedPaid" class="num teal">$0.00</strong>
        </div>
      </div>
      <div class="divider"></div>
      <div class="settle-row">
        <p id="settleText" class="settle-msg">Cuentas al día</p>
        <button type="button" id="settleBtn" class="ghost-btn" hidden>Saldar</button>
      </div>
    </section>

    <section class="glass card">
      <div class="section-head">
        <h2>Movimientos</h2>
        <div class="filter-row">
          <button type="button" class="f-btn active" data-filter="all">Todos</button>
          <button type="button" class="f-btn" data-filter="maria">María</button>
          <button type="button" class="f-btn" data-filter="obed">Obed</button>
        </div>
      </div>
      <ul id="txList" class="tx-list"></ul>
    </section>
  </main>
</div>

<div id="sheetBackdrop" class="sheet-backdrop" hidden>
  <div class="sheet glass-hero" role="dialog" aria-modal="true" aria-label="Nuevo movimiento">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3>Registrar movimiento</h3>
      <button type="button" id="closeSheet" class="close-btn" aria-label="Cerrar">✕</button>
    </div>
    <form id="txForm" class="tx-form">
      <div class="type-seg">
        <button type="button" class="t-btn active" data-type="expense">Gasto</button>
        <button type="button" class="t-btn" data-type="income">Ingreso</button>
      </div>
      <input id="txTitle" type="text" placeholder="Concepto (ej. Supermercado, Cena)" required />
      <div class="grid-2">
        <input id="txAmount" type="number" step="0.01" min="0.01" placeholder="Monto" required />
        <select id="txCat">
          <option value="supermercado">Supermercado</option>
          <option value="hogar">Hogar y Alquiler</option>
          <option value="servicios">Servicios y Luz</option>
          <option value="restaurantes">Restaurantes</option>
          <option value="transporte">Transporte</option>
          <option value="salud">Salud</option>
          <option value="ocio">Ocio en Pareja</option>
          <option value="otros">Otros</option>
        </select>
      </div>
      <div class="grid-2">
        <select id="txPaidBy">
          <option value="maria">Pagó María</option>
          <option value="obed">Pagó Obed</option>
        </select>
        <select id="txSplit">
          <option value="shared_50">Compartido 50/50</option>
          <option value="personal">Solo personal</option>
        </select>
      </div>
      <button type="submit" class="cta-btn full">Guardar movimiento</button>
    </form>
  </div>
</div>
    <script src="app.js"></script>
  </body>
</html>
